services:
  - type: web
    name: mapparaan-planner
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      # Required: api.py will not start on 0.0.0.0 without it. The phone app sends no
      # Origin header, so this only matters for Flutter web. Use your web app's address,
      # e.g. https://your-app.web.app (comma separate several). Render asks for it on first deploy.
      - key: MAPPARAAN_ALLOWED_ORIGINS
        sync: false
        sync: false
